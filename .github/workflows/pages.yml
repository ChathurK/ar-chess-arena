# Simple workflow for deploying static content to GitHub Pages
name: Deploy frontend to GitHub Pages

on:
    # Runs on pushes targeting the main branch, but only for changes to the `frontend` directory
  push:
    branches: [main]
    paths: [frontend/**]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, if a run is in progress and a new run is queued, the in-progress run will be canceled and the latest queued run will be started.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the contents of the `frontend` directory to be deployed to GitHub Pages
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
